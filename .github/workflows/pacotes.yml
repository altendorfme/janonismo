name: Pacotes

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar pacotes
        run: node build.mjs
        env:
          VERSAO: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: Validar pacote do Firefox
        run: npx --yes web-ext lint --source-dir dist/firefox

      - uses: actions/upload-artifact@v4
        with:
          name: janonismo-pacotes
          path: dist/*.zip
          if-no-files-found: error

      - name: Publicar release com os zips
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.zip --verify-tag --generate-notes --title "$TAG" --repo "$GITHUB_REPOSITORY"
          fi
