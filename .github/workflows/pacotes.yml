name: Pacotes

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar pacotes
        run: node build.mjs
        env:
          VERSAO: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

      - name: Validar pacote do Firefox
        run: npx --yes web-ext lint --source-dir dist/firefox

      - uses: actions/upload-artifact@v4
        with:
          name: janonismo-pacotes
          path: dist/*.zip
          if-no-files-found: error

      - name: Anexar zips ao release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
