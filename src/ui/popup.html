<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Janonismo</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 300px; max-width: 100%; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .placar { background: var(--vermelho-claro); border-radius: 10px; padding: 12px; text-align: center; }
    .placar strong { display: block; font-size: 34px; color: var(--vermelho); line-height: 1; }
    .acoes { display: flex; gap: 8px; }
    .acoes button { flex: 1; }
    #aviso-permissao { display: none; flex-direction: column; gap: 8px; border: 1px solid var(--vermelho); border-radius: 10px; padding: 10px; }
    .sugerir { margin: 0; border-top: 1px solid var(--borda); padding-top: 12px; }
    @media (pointer: coarse) {
      body { width: auto; max-width: 480px; margin: 0 auto; padding: 20px 16px; font-size: 16px; gap: 18px; }
      h1 { font-size: 22px; }
      button { min-height: 44px; }
      .interruptor { min-height: 44px; }
      .interruptor input { width: 22px; height: 22px; }
      .placar { padding: 16px; }
      .placar strong { font-size: 42px; }
      .acoes { flex-wrap: wrap; }
      .acoes button { flex: 1 1 140px; }
      .sugerir a { display: inline-block; padding: 8px 0; }
    }
  </style>
</head>
<body>
  <div class="marca">
    <img src="../icons/48.png" alt="">
    <h1>Janonismo</h1>
  </div>

  <div id="aviso-permissao">
    <span>O navegador ainda não deixou a extensão ler as redes sociais.</span>
    <button id="conceder">Permitir</button>
  </div>

  <label class="interruptor"><input type="checkbox" id="ativo"> Proteção ligada</label>

  <div class="placar">
    <strong id="contador">0</strong>
    vezes que o Janones te salvou
  </div>

  <p class="suave" id="total" style="margin:0"></p>

  <div class="acoes">
    <button id="atualizar" class="secundario">Atualizar lista</button>
    <button id="opcoes">Configurações</button>
  </div>
  <p class="suave" id="status" style="margin:0" role="status"></p>

  <p class="sugerir suave">Falta alguém na lista?
    <a id="sugerir" href="https://github.com/janonismo/browser/issues" target="_blank" rel="noopener">Sugira um perfil</a></p>

  <script src="../shared/plataformas.js"></script>
  <script src="../shared/lista.js"></script>
  <script src="../shared/permissoes.js"></script>
  <script src="popup.js"></script>
</body>
</html>
